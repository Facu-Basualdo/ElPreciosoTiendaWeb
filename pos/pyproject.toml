[project]
name = "pos"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "FacuBas", email = "120072462+Facu-Basualdo@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pyside6>=6.11.2",
    "supabase>=2.32.0",
]

[project.scripts]
pos = "pos:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "SIM"]
# B008: Qt usa QModelIndex() como valor por defecto en su propia API.
ignore = ["B008"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
